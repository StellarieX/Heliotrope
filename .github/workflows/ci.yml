name: CI
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Single source of truth for the Node version.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Single source of truth for the Python version.
          python-version-file: .python-version
      - run: pip install -e "./backend[dev]"
      - run: python -m py_compile backend/app/main.py backend/app/core/config.py
      - run: pytest backend/tests -q
  e2e-and-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install -e "./backend[dev]"
      # Hermetic end-to-end suite (in-process TestClient; live deploy checks
      # marked `live` are excluded here and run on demand with -m live).
      - run: python -m pytest tests/e2e -q -k "not live"
      - run: python -m pytest tests/test_firestore_rules_challenge.py -q
