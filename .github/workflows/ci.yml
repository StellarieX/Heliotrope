name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          # Single source of truth for the Node version.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          # Single source of truth for the Python version.
          python-version-file: .python-version
      - run: python -m pip install -r backend/requirements.lock -e "./backend[dev]"
      - run: python -m py_compile backend/app/main.py backend/app/core/config.py
      - run: pytest backend/tests -q
      - run: python -m pytest tests/e2e -q -m 'not live'
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - run: python -m pip install -r backend/requirements.lock -e "./backend[dev]"
      - run: npx --yes supabase@3.4.0 start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor,mailpit > /tmp/heliotrope-supabase-start.log
      - run: npx --yes supabase@3.4.0 test db
      - name: Auth and execution integration
        run: |
          supabase_status=$(npx --yes supabase@3.4.0 status -o json)
          export SUPABASE_URL=$(jq -r .API_URL <<< "$supabase_status")
          export SUPABASE_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY <<< "$supabase_status")
          export SUPABASE_SECRET_KEY=$(jq -r .SECRET_KEY <<< "$supabase_status")
          export DATABASE_URL=$(jq -r .DB_URL <<< "$supabase_status")
          python -m pytest tests/integration -q
