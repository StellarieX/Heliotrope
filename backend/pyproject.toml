[project]
name = "heliotrope-backend"
version = "0.4.1"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.156.2",
  "uvicorn>=0.30",
  "pydantic>=2.14.1",
  "httpx>=0.27",
  "ortools>=9.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.170.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
