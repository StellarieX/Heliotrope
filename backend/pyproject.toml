[project]
name = "heliotrope-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.0",
  "httpx>=0.27",
  # Prepared for the Phase 4 optimization engine. Not imported anywhere yet.
  "ortools>=9.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
