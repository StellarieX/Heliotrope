[project]
name = "heliotrope-backend"
version = "0.1.0"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.0",
  "httpx>=0.27",
  "ortools>=9.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
