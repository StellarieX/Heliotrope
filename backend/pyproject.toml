[project]
name = "heliotrope-backend"
version = "0.4.1"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.165.0",
  "uvicorn>=0.54.0",
  "pydantic>=2.14.4",
  "httpx>=0.29.0",
  "ortools>=9.15.6755",
  "psycopg[binary]>=3.3.9",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "hypothesis>=6.170.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
