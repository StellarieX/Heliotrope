# Render Blueprint: Heliotrope FastAPI backend (Docker).
# Render dashboard > New > Blueprint > pick this repo. Then set the Vercel
# project's BACKEND_URL to the service URL and leave NEXT_PUBLIC_BACKEND_URL unset
# (same-origin mode, see docs/DEPLOYMENT.md).
#
# Free plan: the service sleeps after ~15 min idle and cold-starts in ~50s.
# Hit /api/v1/health a minute before a demo. There is no disk on the free
# plan, so the SQLite execution store resets on every restart/redeploy.
services:
  - type: web
    name: heliotrope-backend
    runtime: docker
    plan: free
    # Closest Render region to the Vercel function region (iad1).
    region: virginia
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: HELIOTROPE_ENV
        value: production
      # Live grid signal: a carbon-intensity estimate built from real solar/wind
      # forecasts (Open-Meteo, no key). Set CARBON_LAT / CARBON_LON to your site
      # (defaults to Bhopal, India) and tune CARBON_WEATHER_* in docs/DEPLOYMENT.md.
      - key: CARBON_PROVIDER
        value: weather
      # Jev, the AI load classifier: used whenever a key is present, and it falls
      # back to the built-in rules per request if Gemini is unreachable.
      - key: LOAD_INTELLIGENCE_PROVIDER
        value: auto
      # Paste the same key you already use as JEV_API_KEY on Vercel (either name
      # works on the backend). Leave blank to run on the built-in rules.
      - key: GEMINI_API_KEY
        sync: false
