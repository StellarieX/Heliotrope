services:
  - type: web
    name: heliotrope-backend
    runtime: docker
    plan: free
    region: virginia
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: HELIOTROPE_ENV
        value: production
      - key: CARBON_PROVIDER
        value: weather
      - key: LOAD_INTELLIGENCE_PROVIDER
        value: auto
      - key: SOLVER_RELATIVE_GAP
        value: "0.0001"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JEV_API_KEY
        sync: false
